<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: url('6.avif') no-repeat center center fixed; /* Replace with your registration background image */
      background-size: cover;
    }
    .card {
      background-color: transparent;
      border: none;
      box-shadow: none;
    }
    .form-label, .btn, p, h2, a {
      color: rgb(251, 246, 246) !important;
    }
    .form-control {
      background-color: rgba(255, 255, 255, 0.15);
      color: white;
      border: none;
    }
    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.25);
      color: white;
      box-shadow: none;
    }
    .input-group-text {
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
    }
    a {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <h2 class="text-center mb-4">Register</h2>
          <form id="registerForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Enter a strong password" required>
              </div>
            </div>
            <button type="submit" class="btn btn-dark w-100">Register</button>
          </form>
          <p class="mt-3 text-center">Already have an account? <a href="index.html">Login here</a></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const users = JSON.parse(localStorage.getItem("users")) || [];

      const alreadyExists = users.some(user => user.email === email);

      if (alreadyExists) {
        alert("User already exists. Please login.");
        return;
      }

      users.push({ email, password });
      localStorage.setItem("users", JSON.stringify(users));

      alert("Registered successfully! Redirecting to login page...");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
